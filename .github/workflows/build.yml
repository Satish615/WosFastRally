name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK (development only; not updateable across runners)
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WosFastRally-DEBUG-NOT-FOR-UPDATES
          path: app/build/outputs/apk/debug/app-debug.apk

      # Configure all four secrets once; never commit the keystore to git.
      - name: Prepare persistent release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.WOS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WOS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WOS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WOS_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Persistent signing secrets not configured; skipping updateable APK."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          KEYSTORE_FILE="$RUNNER_TEMP/wos-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "WOS_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Build updateable signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          WOS_KEYSTORE_PASSWORD: ${{ secrets.WOS_KEYSTORE_PASSWORD }}
          WOS_KEY_ALIAS: ${{ secrets.WOS_KEY_ALIAS }}
          WOS_KEY_PASSWORD: ${{ secrets.WOS_KEY_PASSWORD }}
          WOS_VERSION_CODE: ${{ github.run_number }}
          WOS_VERSION_NAME: 0.4.${{ github.run_number }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload updateable signed APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WosFastRally-SIGNED-RELEASE-USE-FOR-UPDATES
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/wos-release.jks"
